replicaCount: 1

image:
  repository: ghcr.io/markpash/check-in-bot
  tag: latest
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: checkin.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  storageClassName: ""

config:
  baseURL: https://checkin.example.com
  checkinSchedule: "0 9 * * *"
  adminId: ""
  dev: false

secret:
  create: true
  name: ""
  telegramToken: ""

env: []
